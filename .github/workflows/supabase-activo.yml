# Mantiene activo el proyecto de Supabase (el plan gratuito lo pausa tras unos 7 días sin actividad).
# Una vez por semana lee una fila de una vista pública de solo lectura (supabase/sql/04_api_lectura_publica.sql)
# con la clave pública anon. No escribe nada. También se puede lanzar a mano desde la pestaña Actions.
# Secretos del repositorio: SUPABASE_URL y SUPABASE_ANON_KEY.
name: Supabase activo

on:
  schedule:
    - cron: "17 6 * * 1,4"   # lunes y jueves, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consulta:
    runs-on: ubuntu-latest
    steps:
      - name: Leer una fila de tfm_datasets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          estado=$(curl -s -o respuesta.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/tfm_datasets?select=codigo&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "Respuesta HTTP: $estado"
          cat respuesta.json; echo
          if [ "$estado" != "200" ]; then
            echo "::error::Supabase no respondió 200: puede estar pausado. Restáuralo desde el panel (Restore project)."
            exit 1
          fi
