<title>Análisis del estrés estudiantil</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: banda teal con menú de 7 páginas (como el Power BI) + rejilla de tarjetas blancas sobre fondo crema.
   Tema «Bienestar» del informe de Power BI (TFM_Estres_tema_bienestar.json). */
:root {
  --bg: #FAF6F0; --surface: #FFFFFF; --line: #E6DED3; --ink: #264653; --ink-2: #4F5D63; --muted: #7A868A;
  --band: #2A7F7F; --band-ink: #FFFFFF; --nav: #FFFFFF; --nav-ink: #264653; --nav-on: #264653; --nav-on-ink: #FFFFFF;
  --head: #2A7F7F; --head-ink: #FFFFFF; --zebra: #F2F8F7; --grid: #EFE9E1; --shadow: rgba(38,70,83,.10);
  --bajo: #2A9D8F; --mod: #E9C46A; --alto: #E76F51; --h-dim: #56676C; --h-cat: #8A9499; --serie1: #2A9D8F; --serie2: #E76F51; --alerta: #D35A3D;
  --font: "Segoe UI", "Segoe UI Variable", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-strong: "Segoe UI Semibold", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111A1A; --surface: #1A2626; --line: #2C3B3A; --ink: #E4EDEC; --ink-2: #B6C4C2; --muted: #8B9C9A;
  --band: #1E5E5E; --band-ink: #FFFFFF; --nav: #2A6E6E; --nav-ink: #EAF4F3; --nav-on: #0D1515; --nav-on-ink: #FFFFFF;
  --head: #1E5E5E; --head-ink: #FFFFFF; --zebra: #1F2D2D; --grid: #263534; --shadow: rgba(0,0,0,.35);
  --alerta: #F08A6E; --h-dim: #4C5E61; --h-cat: #5E6B6D; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111A1A; --surface: #1A2626; --line: #2C3B3A; --ink: #E4EDEC; --ink-2: #B6C4C2; --muted: #8B9C9A;
  --band: #1E5E5E; --band-ink: #FFFFFF; --nav: #2A6E6E; --nav-ink: #EAF4F3; --nav-on: #0D1515; --nav-on-ink: #FFFFFF;
  --head: #1E5E5E; --head-ink: #FFFFFF; --zebra: #1F2D2D; --grid: #263534; --shadow: rgba(0,0,0,.35);
  --alerta: #F08A6E; --h-dim: #4C5E61; --h-cat: #5E6B6D; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45 }
table { font-size: inherit; color: inherit }
h1, h2, h3 { font-family: var(--font-strong); font-weight: 600; margin: 0; text-wrap: balance }
p { margin: 0 }
.tab { font-variant-numeric: tabular-nums }

/* Banda superior */
.banda { background: var(--band); color: var(--band-ink) }
.banda-in { max-width: 1280px; margin: 0 auto; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 12px 24px; align-items: center; flex-wrap: wrap }
.banda h1 { font-size: 21px; line-height: 1.2 }
.banda .sub { font-size: 12.5px; opacity: .9 }
.banda .titulo { flex: 1 1 320px; min-width: 0 }
nav { display: flex; flex-wrap: wrap; gap: 6px }
nav a { display: inline-block; padding: 9px 14px; min-width: 92px; text-align: center; border-radius: 4px; background: var(--nav);
  color: var(--nav-ink); text-decoration: none; font-size: 13px; border: 1px solid transparent }
nav a:hover { border-color: var(--band-ink) }
nav a[aria-current="page"] { background: var(--nav-on); color: var(--nav-on-ink); font-family: var(--font-strong); font-weight: 600 }
a:focus-visible, select:focus-visible, .bar-hit:focus-visible { outline: 2px solid var(--alto); outline-offset: 2px }

main { max-width: 1280px; margin: 0 auto; padding-block: 16px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px }
.fila { display: grid; gap: 14px; grid-template-columns: repeat(var(--c, 2), minmax(0, 1fr)) }
@media (max-width: 900px) { .fila { grid-template-columns: minmax(0, 1fr) !important } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 4px 14px var(--shadow);
  padding: 14px 16px; min-width: 0 }
.card h2 { font-size: 16px; margin-bottom: 10px }
.card h3 { font-size: 14.5px; margin-bottom: 4px }
.nota { font-size: 12.5px; color: var(--ink-2) }
.nota p + p, .texto p + p { margin-top: 4px }
.texto { color: var(--ink-2); font-size: 13.5px; max-width: 75ch }

/* Filtros */
.filtros { display: grid; gap: 14px; grid-template-columns: repeat(4, minmax(0, 1fr)) }
@media (max-width: 900px) { .filtros { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.filtros label { display: block; font-family: var(--font-strong); font-weight: 600; color: var(--head); font-size: 14px; margin-bottom: 6px }
:root[data-theme="dark"] .filtros label { color: var(--ink) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .filtros label { color: var(--ink) } }
.filtros select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface);
  color: var(--ink); font: inherit; font-size: 13px }

/* Tarjetas numéricas */
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)) }
.kpi { border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; min-width: 0 }
.kpi .et { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.kpi .v { font-family: var(--font-strong); font-weight: 600; font-size: 30px; line-height: 1.15; font-variant-numeric: tabular-nums }
.kpi .v.alerta { color: var(--alerta) }

/* Gráficos de barras (HTML, a escala) */
.leyenda { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px }
.leyenda b { color: var(--ink); font-family: var(--font-strong); font-weight: 600 }
.leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px }
.hb { display: grid; grid-template-columns: minmax(90px, max-content) minmax(0, 1fr); gap: 6px 10px; align-items: center; font-size: 12.5px }
.hb .lab { color: var(--ink-2); text-align: right; overflow-wrap: anywhere }
.pista, .eje { margin-right: 46px }  /* hueco para la etiqueta de valor de la barra más larga */
.pista { position: relative; min-height: 22px }
.pista .g { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--grid) }
.barra { position: relative; height: 18px; border-radius: 0 4px 4px 0; display: flex; align-items: center }
.barra + .barra { margin-top: 2px }
.barra span { position: absolute; left: calc(100% + 6px); white-space: nowrap; color: var(--ink-2); font-size: 11.5px; font-variant-numeric: tabular-nums }
.eje { position: relative; height: 16px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums }
.eje span { position: absolute; transform: translateX(-50%) }
.titulo-eje { text-align: center; font-size: 12px; color: var(--ink-2); font-family: var(--font-strong); font-weight: 600; margin-top: 2px }

.cols { display: flex; align-items: flex-end; gap: 10px; height: 180px; padding-top: 18px; border-bottom: 1px solid var(--line); position: relative }
.cols .grp { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 2px; height: 100%; min-width: 0 }
.col { position: relative; width: min(56px, 42%); border-radius: 4px 4px 0 0 }
.col span { position: absolute; bottom: calc(100% + 3px); left: 50%; transform: translateX(-50%); font-size: 11.5px; color: var(--ink-2);
  white-space: nowrap; font-variant-numeric: tabular-nums }
.cols-lab { display: flex; gap: 10px; font-size: 12px; color: var(--ink-2); margin-top: 4px }
.cols-lab div { flex: 1; text-align: center; min-width: 0; overflow-wrap: anywhere }

.apilada { display: flex; height: 22px; gap: 2px }
.apilada div { display: flex; align-items: center; justify-content: center; font-size: 11.5px; color: #FFFFFF; overflow: hidden;
  font-variant-numeric: tabular-nums; min-width: 0 }
.apilada div.claro { color: #264653 }
.apilada div:last-child { border-radius: 0 4px 4px 0 }

/* Tablas */
.tabla-env { overflow-x: auto }
table.t { border-collapse: collapse; width: 100%; font-size: 12.5px }
.t th { background: var(--head); color: var(--head-ink); text-align: left; font-family: var(--font-strong); font-weight: 600; padding: 6px 8px; vertical-align: bottom }
.t td { padding: 5px 8px; border-bottom: 1px solid var(--grid); vertical-align: top }
.t tbody tr:nth-child(even) td { background: var(--zebra) }
.t .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap }
.t tr.total td { font-family: var(--font-strong); font-weight: 600; border-top: 1px solid var(--ink-2) }

.bloque a { color: var(--ink); font-family: var(--font-strong); font-weight: 600 }
.vacio { color: var(--muted); font-size: 13px; padding: 12px 0 }
footer { max-width: 1280px; margin: 0 auto; padding-block: 0 24px; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: 12px; color: var(--muted) }

/* Arquitectura */
.flujo { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px }
.paso { flex: 1 1 130px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; background: var(--zebra) }
.paso b { display: block; font-family: var(--font-strong); font-weight: 600; font-size: 13px }
.paso span { font-size: 12px; color: var(--ink-2) }
.paso.nube { border-color: var(--band); background: var(--surface) }
.flecha { align-self: center; color: var(--muted); font-size: 18px }
@media (max-width: 700px) { .flecha { display: none } }
.capas { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px }
.capas button { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); cursor: pointer }
.capas button[aria-pressed="true"] { background: var(--band); color: var(--band-ink); border-color: var(--band) }
.capas button:focus-visible, .tbl:focus-visible { outline: 2px solid var(--alto); outline-offset: 2px }
.diagrama { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) }
.lienzo { overflow-x: auto }
.lienzo svg { display: block; width: 100%; min-width: 640px; height: auto }
.lienzo text { font-family: var(--font); fill: var(--ink) }
.tbl { cursor: pointer }
.tbl:hover rect.cuerpo, .tbl.sel rect.cuerpo { stroke: var(--ink); stroke-width: 2 }
.ficha h3 { font-size: 15px; margin-bottom: 2px; overflow-wrap: anywhere }
.ficha .meta { font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px }
.ficha ul { list-style: none; margin: 0; padding: 0; font-size: 12.5px; columns: 3 200px; column-gap: 24px }
.ficha li { break-inside: avoid; padding: 3px 0; border-bottom: 1px solid var(--grid); display: flex; gap: 8px; align-items: baseline }
.chip { font-size: 10.5px; font-family: var(--font-strong); font-weight: 600; padding: 0 5px; border-radius: 3px; min-width: 22px; text-align: center }
.chip.PK { background: var(--band); color: var(--band-ink) }
.chip.FK { background: var(--alto); color: #FFFFFF }
.leyenda-arq { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin-top: 8px }
.leyenda-arq i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 5px; vertical-align: -2px }
.correccion { border-left: 3px solid var(--alto); padding-left: 10px }

/* Inicio: fondo suave (como la imagen de fondo del Power BI), logo e iconos de los bloques */
body.con-fondo { background:
  radial-gradient(640px 420px at 0% 100%, rgba(42,157,143,.14), transparent 70%),
  radial-gradient(520px 380px at 100% 0%, rgba(168,218,220,.20), transparent 70%),
  radial-gradient(440px 320px at 100% 100%, rgba(233,196,106,.16), transparent 70%), var(--bg) }
.titulo-fila { display: flex; align-items: center; gap: 18px; flex-wrap: wrap }
.logos { display: inline-flex; align-items: center; gap: 12px }
#logo { height: 20px; width: auto }
#logo2 { height: 34px; width: auto }
.sep-logo { width: 1px; height: 30px; background: rgba(255,255,255,.65) }
.icono-bloque { width: 40px; height: 40px; margin-bottom: 6px }

/* Barras que se pueden pulsar (bajar de nivel u obtener detalles) */
.clicable .barra, .clicable .lab { cursor: pointer }
.clicable .barra:hover { filter: brightness(1.08) }
.boton { font: inherit; font-size: 12.5px; padding: 5px 10px; border-radius: 4px; border: 1px solid var(--band); background: var(--surface);
  color: var(--band); cursor: pointer }
.boton:hover { background: var(--zebra) }
.boton:focus-visible, .nodo:focus-visible, .mas:focus-visible { outline: 2px solid var(--alto); outline-offset: 2px }
.cab-card { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px }
.cab-card h2 { margin: 0 }

/* Tooltip enriquecido (equivale a la página de tooltip del Power BI) */
#tip .tt-t { font-family: var(--font-strong); font-weight: 600; margin-bottom: 4px }
#tip .tt-kpi { display: flex; gap: 14px; margin-bottom: 6px }
#tip .tt-kpi b { display: block; font-size: 15px }
#tip .tt-barra { display: flex; height: 10px; gap: 2px; width: 220px }
#tip .tt-barra i { display: block }
#tip .tt-ley { display: flex; gap: 8px; font-size: 11px; margin-top: 3px; opacity: .85 }

/* Árbol de descomposición */
.arbol { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; min-height: 320px }
.nivel { flex: 0 0 170px; min-width: 0 }
.nivel-cab { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--band); margin-bottom: 8px;
  font-family: var(--font-strong); font-weight: 600; font-size: 13px; padding-bottom: 2px }
.nivel-cab button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0 2px }
.nivel-sel { font-size: 11px; color: var(--ink-2); margin: -6px 0 8px; min-height: 14px }
.nodos { display: grid; gap: 6px; max-height: 300px; overflow-y: auto; padding-right: 4px }
.nodo { display: block; width: 100%; text-align: left; border: 1px solid transparent; border-radius: 4px; background: none; padding: 3px 4px;
  color: var(--ink); font: inherit; font-size: 12px; cursor: pointer }
.nodo:hover { background: var(--zebra) }
.nodo.sel { border-color: var(--band); background: var(--zebra) }
.nodo .pista-n { height: 9px; background: var(--grid); border-radius: 2px; margin-bottom: 2px }
.nodo .pista-n i { display: block; height: 100%; background: var(--serie1); border-radius: 2px }
.nodo .v { color: var(--ink-2); font-variant-numeric: tabular-nums }
.mas-env { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap }
.mas { border: 1px dashed var(--band); background: none; color: var(--band); border-radius: 4px; width: 26px; height: 22px; cursor: pointer }
.mas-env select { font: inherit; font-size: 12px; padding: 2px 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--ink) }

/* Influenciadores clave */
.ki-cab { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; margin-bottom: 10px }
.ki-cab select { font: inherit; font-size: 13px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--ink) }
.ki { display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 6px 12px; align-items: center; font-size: 12.5px; max-width: 760px }
.ki .q { color: var(--ink-2) }
.ki .q b { color: var(--ink) }
.ki .burbuja { justify-self: center; width: 56px; height: 34px; border-radius: 17px; background: var(--zebra); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center; font-family: var(--font-strong); font-weight: 600; font-variant-numeric: tabular-nums }

#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 5px 8px;
  border-radius: 4px; max-width: 280px; box-shadow: 0 4px 12px var(--shadow) }
@media (prefers-reduced-motion: no-preference) { .barra, .col, .apilada div { transition: width .25s ease, height .25s ease } }
</style>

  <div class="banda-in">
    <div class="titulo"><div class="titulo-fila"><h1 id="titulo">Estrés estudiantil</h1><span class="logos" id="logos" hidden><img id="logo" alt="INESDI Business Techschool"><i class="sep-logo" aria-hidden="true"></i><img id="logo2" alt="UNIE Universidad"></span></div><p class="sub" id="subtitulo"></p></div>

<main>

// ---------------------------------------------------------------- formato es-ES (como el Power BI)
function fnum(v, dec = 0) {
  if (v == null || !isFinite(v)) return "—";
  // toPrecision(12) evita el error binario de toFixed (17,005 → 17,01, como Power BI)
  const f = Math.pow(10, dec), r = Math.round(+Math.abs(v).toPrecision(12) * f) / f;
  const [e, d] = r.toFixed(dec).split(".");
  return (v < 0 ? "−" : "") + e.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (d ? "," + d : "");
}
const fpct = (v, dec = 1) => v == null || !isFinite(v) ? "—" : fnum(v * 100, dec) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
const wmean = (a, v, w) => { const n = sum(a, w); return n ? sum(a, x => v(x) * w(x)) / n : null; };
const porNombre = (a, b) => a.localeCompare(b, "es");
function fechaCorta(s) { const [d, t] = s.split(" "); const [y, m, dd] = d.split("-"); return `${dd}/${m}/${y} ${t.slice(0, 5)}`; }

[["f-bloque", "bloque"], ["f-genero", "g"], ["f-edad", "e"], ["f-educ", "ed"]].forEach(([id, k]) =>

}
const registros = r => sum(r, x => x[5]);
const pctNivel = (r, n) => { const t = registros(r); return t ? sum(r.filter(x => x[4] === n), x => x[5]) / t : null; };
function agrupar(r, clave) {
  const m = new Map();
  r.forEach(x => { const k = clave(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); });
  return m;
}

// ---------------------------------------------------------------- piezas
function ticks(max) {
  if (!(max > 0)) return [0, 1];
  const bruto = max / 4, p = Math.pow(10, Math.floor(Math.log10(bruto)));
  const paso = [1, 2, 2.5, 5, 10].map(k => k * p).find(s => s >= bruto);
  const t = []; for (let v = 0; v < max + paso * 0.999; v += paso) t.push(+v.toFixed(10));
  return t;
}
const tip = (t) => `data-tip="${esc(t)}"`;

// Barras horizontales; series: [{nombre, color, valor: item => número, texto}]
function barrasH(items, series, { fmt = fpct, tituloEje = "", attrs = null } = {}) {
  if (!items.length) return '<p class="vacio">Sin registros con esta selección.</p>';
  const max = Math.max(...items.flatMap(it => series.map(s => s.valor(it) || 0)));
  const t = ticks(max), top = t[t.length - 1];
  const grid = t.map(v => `<i class="g" style="left:${v / top * 100}%"></i>`).join("");
  let h = series.length > 1 ? leyenda(series) : "";
  h += '<div class="hb">';
  items.forEach(it => {
    h += `<div class="lab">${esc(it.etiqueta)}</div><div class="pista">${grid}` + series.map(s => {
      const v = s.valor(it);
      return `<div class="barra bar-hit" tabindex="0" ${attrs ? attrs(it) : tip(`${it.etiqueta} · ${s.nombre}: ${fmt(v)}`)}
        style="width:${(v || 0) / top * 100}%;background:var(${s.color})"><span>${fmt(v)}</span></div>`;
    }).join("") + "</div>";
  });
  // Etiquetas del eje con los decimales justos para el paso (20% · 2,5% · 0,5)
  const esPct = fmt === fpct, paso = (t[1] - t[0]) * (esPct ? 100 : 1);
  const dec = Number.isInteger(+paso.toFixed(6)) ? 0 : Number.isInteger(+(paso * 10).toFixed(6)) ? 1 : 2;
  const fe = v => esPct ? fpct(v, dec) : fnum(v, dec);
  h += `<div></div><div class="eje">${t.map(v => `<span style="left:${v / top * 100}%">${fe(v)}</span>`).join("")}</div></div>`;
  if (tituloEje) h += `<div class="titulo-eje">${esc(tituloEje)}</div>`;
  return h;
}
function leyenda(series, titulo = "") {
  return `<div class="leyenda">${titulo ? `<b>${esc(titulo)}</b>` : ""}${series.map(s =>
    `<span><i style="background:var(${s.color})"></i>${esc(s.nombre)}</span>`).join("")}</div>`;
}
// Columnas agrupadas; categorias: [{etiqueta, ...}], series como en barrasH
function columnas(cats, series, { tituloLeyenda = "", tituloEje = "" } = {}) {
  const max = Math.max(...cats.flatMap(c => series.map(s => s.valor(c) || 0)));
  const top = ticks(max).slice(-1)[0];
  let h = series.length > 1 ? leyenda(series, tituloLeyenda) : "";
  h += '<div class="cols">' + cats.map(c => '<div class="grp">' + series.map(s => {
    const v = s.valor(c);
    return `<div class="col bar-hit" tabindex="0" ${tip(`${c.etiqueta}${series.length > 1 ? " · " + s.nombre : ""}: ${fpct(v)}`)}
      style="height:${(v || 0) / top * 100}%;background:var(${s.color})"><span>${fpct(v)}</span></div>`;
  }).join("") + "</div>").join("") + "</div>";
  h += '<div class="cols-lab">' + cats.map(c => `<div>${esc(c.etiqueta)}</div>`).join("") + "</div>";
  if (tituloEje) h += `<div class="titulo-eje">${esc(tituloEje)}</div>`;
  return h;
}
const tarjeta = (et, v, clase = "") => `<div class="kpi"><div class="et" title="${esc(et)}">${esc(et)}</div><div class="v ${clase}">${v}</div></div>`;

function tabla(cabeza, cuerpo, pie = "") {

      <p>12 datasets públicos organizados en 4 bloques analíticos. Cada fuente se estudia por separado y se compara con las demás mediante un nivel de estrés común (Bajo / Moderado / Alto) y dimensiones conformes de género, edad y nivel educativo.</p>
      <p>${fnum(total)} registros en las 9 fuentes con señal real; los 3 datasets sintéticos quedan fuera de las medidas.</p>
      <p>Navega con el menú superior. Las tarjetas son los 6 KPIs guardados en el DWH (última ejecución).</p></div>`)}
    ${card("", `<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${KPIS.map(([c, n]) => tarjeta(n, fnum(kpi(c), 2))).join("")}</div>`)}
  </div>
  <div class="fila" style="--c:4">${bloquesTxt.map(([t, f, p, ic]) => card("", `<div class="bloque">${IMG[ic] ? `<img class="icono-bloque" src="${IMG[ic]}" alt="">` : ""}<h3>${esc(t)}</h3>
    <p class="texto">${esc(f)}</p><p class="texto" style="margin-top:6px">Página principal: ${p.map(([id, n]) => `<a href="#${id}">${n}</a>`).join(" y ")}</p></div>`)).join("")}</div>
  ${card("Cómo leer el informe", `<div class="texto" style="max-width:none">
    <p>Cada fuente define «Alto» con su propio criterio nativo, mapeado a un constructo común (GAD-7 y DASS con baremos clínicos): compara tendencias, no niveles absolutos entre fuentes.</p>
    <p>Los filtros de Panorama, Demografía y Explorar están sincronizados: la selección se mantiene al cambiar de página. Explorar desglosa el estrés Alto con un árbol de descomposición y los influenciadores clave. Clic sobre un dataset abre su ficha; al pasar el ratón por las barras de Panorama se ve su resumen. Solo el 17 % de los registros informa a la vez género y edad.</p>
    <p>Advertencias: Depression Student (AUC ≈ 1, posible etiqueta generada por fórmula) y Academic Stress (n = 140) se leen con cautela.</p></div>`)}`;
}

let bloqueAbierto = null;  // jerarquía bloque → dataset del primer gráfico
function panorama() {
  const r = filas(), t = registros(r);
  const cobertura = t ? registros(r.filter(x => x[1] !== 0 && x[2] !== 0)) / t : null;
  const fuentes = new Set(r.map(x => x[0])).size;
  const serie = [{ nombre: "% estrés Alto", color: "--serie1", valor: it => it.v }];
  const porDs = rr => [...agrupar(rr, x => x[0])].map(([k, v]) => ({ etiqueta: DS.get(k).nombre, id: k, v: pctNivel(v, ALTO) })).sort((a, b) => b.v - a.v);
  const attrDs = it => `data-ds="${it.id}" data-tipds="${it.id}" role="button" aria-label="Ver la ficha de ${esc(it.etiqueta)}"`;
  let izq;
  if (bloqueAbierto) {
    const items = porDs(r.filter(x => DS.get(x[0]).bloque === bloqueAbierto));
    izq = `<div class="cab-card"><h2>% de estrés Alto · ${esc(bloqueAbierto)}</h2><button class="boton" id="subir-bloque" type="button">↑ Bloques</button></div>
      <div class="clicable">${barrasH(items, serie, { tituloEje: "% estrés Alto", attrs: attrDs })}</div>`;
  } else {
    const items = [...agrupar(r, x => DS.get(x[0]).bloque)].map(([k, v]) => ({ etiqueta: k, v: pctNivel(v, ALTO) })).sort((a, b) => b.v - a.v);
    izq = `<div class="cab-card"><h2>% de estrés Alto por bloque (clic: baja a dataset)</h2></div>
      <div class="clicable">${barrasH(items, serie, { tituloEje: "% estrés Alto",
        attrs: it => `data-bloque="${esc(it.etiqueta)}" data-tipbl="${esc(it.etiqueta)}" role="button" aria-label="Ver los datasets de ${esc(it.etiqueta)}"` })}</div>`;
  }
  return `${card("", `<div class="kpis">${tarjeta("Registros", fnum(t))}${tarjeta("% estrés Alto", fpct(pctNivel(r, ALTO)))}
      ${tarjeta("% estrés Alto global", fpct(pctNivel(filas(false), ALTO)))}${tarjeta("Cobertura demográfica", fpct(cobertura))}${tarjeta("Fuentes", fnum(fuentes))}</div>`)}
    <div class="fila" style="--c:2">
      <section class="card">${izq}</section>
      <section class="card"><div class="cab-card"><h2>% de estrés Alto por dataset</h2></div>
        <div class="clicable">${barrasH(porDs(r), serie, { tituloEje: "% estrés Alto", attrs: attrDs })}</div></section>
    </div>
    <p class="nota">Compara tendencias, no niveles absolutos: cada fuente define «Alto» con su criterio (GAD-7 y DASS con baremos clínicos). Pasa el ratón por una barra para ver el resumen; clic en un dataset abre su ficha.</p>`;
}

function demografia() {
  const r = filas();
  const serie = [{ nombre: "% estrés Alto", color: "--serie1", valor: c => c.v }];
  const dim = (idx, nombres, orden) => [...agrupar(r.filter(x => x[idx] !== 0), x => x[idx])]
    .map(([k, v]) => ({ k, etiqueta: nombres(k), v: pctNivel(v, ALTO) })).sort(orden);
  const gen = dim(1, k => GEN[k], (a, b) => porNombre(a.etiqueta, b.etiqueta));
  const eda = dim(2, k => EDAD.get(k), (a, b) => a.k - b.k);
  const edu = dim(3, k => EDUC.get(k), (a, b) => a.k - b.k);
  const vacio = '<p class="vacio">Sin registros con esta selección.</p>';
  const graf = (c) => c.length ? columnas(c, serie) : vacio;

  // Matriz Género × rango de edad (sin «No reportado»), con totales como en el Power BI
  const rm = r.filter(x => x[1] !== 0 && x[2] !== 0);
  const gs = [...new Set(rm.map(x => x[1]))].sort((a, b) => porNombre(GEN[a], GEN[b]));
  const es = [...new Set(rm.map(x => x[2]))].sort((a, b) => a - b);
  const celda = sub => `<td class="n">${fpct(pctNivel(sub, ALTO))}</td><td class="n">${fnum(registros(sub))}</td>`;
  let cuerpo = gs.map(g => `<tr><td>${esc(GEN[g])}</td>${es.map(e => celda(rm.filter(x => x[1] === g && x[2] === e))).join("")}${celda(rm.filter(x => x[1] === g))}</tr>`).join("");
  cuerpo += `<tr class="total"><td>Total</td>${es.map(e => celda(rm.filter(x => x[2] === e))).join("")}${celda(rm)}</tr>`;
  const matriz = rm.length ? `<div class="tabla-env"><table class="t"><thead>
      <tr><th>Rango de edad</th>${es.map(e => `<th colspan="2">${esc(EDAD.get(e))}</th>`).join("")}<th colspan="2">Total</th></tr>
      <tr><th>Género</th>${[...es, 0].map(() => '<th class="n">% Alto</th><th class="n">Registros</th>').join("")}</tr></thead>
      <tbody>${cuerpo}</tbody></table></div>` : vacio;

  return `<div class="fila" style="--c:3">
      ${card("% de estrés Alto por género", graf(gen))}${card("% de estrés Alto por rango de edad", graf(eda))}${card("% de estrés Alto por nivel educativo", graf(edu))}
    </div>
    <div class="fila" style="grid-template-columns:minmax(0,3fr) minmax(0,1fr)">
      ${card("Género × rango de edad", matriz)}
      ${card("Cómo leer esta página", `<div class="nota"><p>Solo el 17 % de los registros informa género y edad a la vez: los filtros demográficos reducen mucho la muestra.</p>
        <p>El 91 % de «Masculino» procede del Mental Health Dataset.</p><p>«Otro»: solo 677 registros, leer con cautela.</p><p>«No reportado» no se muestra.</p></div>`)}
    </div>`;
}

function lenguaje() {
  const liwc = (r, n) => wmean(r.filter(x => x.nivel === n), x => x.liwc, x => x.posts);
  const ratio = r => { const b = liwc(r, BAJO); return b ? liwc(r, ALTO) / b : null; };
  const subs = [...agrupar(D.nlp, x => x.sub)].map(([k, v]) => ({
    etiqueta: D.subreddits[k], alto: liwc(v, ALTO), bajo: liwc(v, BAJO), ratio: ratio(v),
    posts: sum(v, x => x.posts), sent: wmean(v, x => x.sent, x => x.posts) }));
  const graf = [...subs].sort((a, b) => b.alto - a.alto);
  const f2 = (v, d = 2) => fnum(v, d);
  const series = [{ nombre: "Con estrés", color: "--serie1", valor: s => s.alto }, { nombre: "Sin estrés", color: "--serie2", valor: s => s.bajo }];
  const filasT = [...subs].sort((a, b) => porNombre(a.etiqueta, b.etiqueta)).map(s =>
    `<tr><td>${esc(s.etiqueta)}</td><td class="n">${fnum(s.ratio, 2)}</td><td class="n">${fnum(s.posts)}</td><td class="n">${fnum(s.sent, 3)}</td></tr>`).join("");
  return `${card("", `<div class="kpis">${tarjeta("Ratio LIWC ansiedad (Alto / Bajo)", fnum(ratio(D.nlp), 2))}
      ${tarjeta("Sentimiento medio", fnum(wmean(D.nlp, x => x.sent, x => x.posts), 3))}${tarjeta("Posts analizados", fnum(sum(D.nlp, x => x.posts)))}</div>`)}
    <div class="fila" style="grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)">
      ${card("Vocabulario de ansiedad (LIWC) por subreddit", barrasH(graf, series, { fmt: f2, tituloEje: "Densidad media de palabras de ansiedad (LIWC)" }))}
      ${card("Detalle por subreddit", tabla([["Subreddit"], ["Ratio", 1], ["Posts", 1], ["Sentimiento", 1]], filasT))}
    </div>
    <p class="nota">Dreaddit no incluye género ni edad: esta página no usa filtros demográficos. Un ratio &gt; 1 indica más vocabulario de ansiedad en los posts con estrés.</p>`;
}

function validacion() {
  const ans = g => wmean(D.dass.filter(x => x.g === g), x => x.ans, x => x.n);
  const sev = r => { const v = wmean(r, x => x.sev, x => x.n); return v == null ? null : v / 100; };
  const trat = r => { const n = sum(r, x => x.n); return n ? sum(r, x => x.trat) / n : null; };
  const nivs = [BAJO, MOD, ALTO].map(n => ({ etiqueta: NIV[n], r: D.tratamiento.filter(x => x.nivel === n) }));
  // Valores de antecedentes tal como vienen en los datos («No / Sí» en Supabase, «No / Yes» en MySQL), «No» primero
  const ants = [...new Set(D.tratamiento.map(x => x.ant))].sort((a, b) => (a === "No" ? -1 : b === "No" ? 1 : porNombre(a, b)));
  const sT = ants.map((a, i) => ({ nombre: a, color: i ? "--serie2" : "--serie1", valor: c => trat(c.r.filter(x => x.ant === a)) }));
  const eds = [1, 2, 3].map(e => ({ etiqueta: EDUC.get(e), r: D.dass.filter(x => x.ed === e) }));
  const sD = [[2, "--serie1"], [1, "--serie2"]].map(([g, c]) => ({ nombre: GEN[g], color: c, valor: x => sev(x.r.filter(y => y.g === g)) }));
  return `<div class="fila" style="grid-template-columns:minmax(0,3fr) minmax(0,1fr)">
      ${card("", `<div class="kpis">${tarjeta("Brecha ansiedad M − H (pts)", fnum(ans(2) - ans(1), 2))}${tarjeta("% estrés severo DASS", fpct(sev(D.dass)))}
        ${tarjeta("% búsqueda de tratamiento", fpct(trat(D.tratamiento)))}</div>`)}
      ${card("", `<div class="kpis">${tarjeta("Riesgo crítico, KPI 3 (%)", fnum(kpi("KPI_RIESGO_CRITICO"), 2))}</div>`)}
    </div>
    <div class="fila" style="--c:2">
      ${card("Búsqueda de tratamiento por nivel de estrés y antecedentes familiares", columnas(nivs, sT, { tituloLeyenda: "Antecedentes familiares", tituloEje: "Nivel de estrés" }))}
      ${card("DASS-42: % de estrés severo por estudios y género", columnas(eds, sD, { tituloLeyenda: "Género", tituloEje: "Nivel educativo" }))}
    </div>
    ${card("Lectura", `<div class="texto" style="max-width:none"><p>La búsqueda de tratamiento depende de los antecedentes familiares (≈72 % con antecedentes frente a ≈35 % sin ellos), no del nivel de estrés percibido: brecha entre malestar y ayuda.</p>
      <p>Advertencia: el KPI 3 se calcula sobre Depression Student, cuyo modelo obtuvo AUC 0,998 (posible etiqueta generada por fórmula). Interpretar con cautela.</p></div>`)}`;
}

function modelos() {
  const m = D.modelos;
  const sinAlerta = m.filter(x => !x.alerta), conAlerta = m.filter(x => x.alerta);
  const auc = [...m].sort((a, b) => b.auc - a.auc).map(x => ({ etiqueta: x.dataset, v: x.auc }));
  const f3 = (v) => fnum(v, 3);
  const filasT = [...m].sort((a, b) => porNombre(a.dataset, b.dataset)).map(x => `<tr><td>${esc(x.dataset)}</td><td>${esc(x.modelo)}</td>
    <td>${esc(x.protocolo)}</td><td class="n">${fnum(x.n)}</td><td class="n">${f3(x.auc)}</td><td class="n">${f3(x.f1)}</td><td class="n">${f3(x.acc)}</td></tr>`).join("");
  return `<div class="fila" style="--c:2">
      ${card("", `<div class="kpis">${tarjeta("AUC medio (sin alertas)", f3(sum(sinAlerta, x => x.auc) / sinAlerta.length))}
        ${tarjeta("Datasets con alerta", fnum(conAlerta.length), "alerta")}</div>`)}
      ${card("Alertas", `<div class="texto"><p>Academic Stress: n = 140, el accuracy no supera al baseline (exploratorio).</p>
        <p>Depression Student: AUC ≈ 1, posible etiqueta generada por fórmula.</p></div>`)}
    </div>
    <div class="fila" style="grid-template-columns:minmax(0,1fr) minmax(0,2fr)">
      ${card("AUC del mejor modelo por dataset", barrasH(auc, [{ nombre: "AUC", color: "--serie1", valor: x => x.v }], { fmt: (v, d) => fnum(v, d ?? 3), tituloEje: "AUC" }))}
      ${card("Detalle del mejor modelo", tabla([["Dataset"], ["Modelo"], ["Protocolo"], ["n", 1], ["AUC", 1], ["F1", 1], ["Accuracy", 1]], filasT))}
    </div>`;
}

function kpis() {
  const cat = [...D.kpi_catalogo].sort((a, b) => porNombre(a.nombre, b.nombre));
  const hist = cat.map(k => `<tr><td>${esc(k.nombre)}</td>${fechas.map(f => {
    const r = D.kpi_resultados.find(x => x.codigo === k.codigo && x.fecha === f);
    return `<td class="n">${r ? fnum(r.valor, 2) : ""}</td>`; }).join("")}</tr>`).join("");
  const filasC = cat.map(k => `<tr><td>${esc(k.nombre)}</td><td>${esc(k.unidad)}</td><td>${esc(k.descripcion)}</td></tr>`).join("");
  const niveles = [[BAJO, "--bajo", false], [MOD, "--mod", true], [ALTO, "--alto", false]];
  const porDs = [...agrupar(filas(false).filter(x => x[4] !== 0), x => x[0])]
    .map(([k, v]) => ({ nombre: DS.get(k).nombre, r: v })).sort((a, b) => porNombre(a.nombre, b.nombre));
  const barras = porDs.map(d => {
    const t = registros(d.r);
    return `<div class="lab">${esc(d.nombre)}</div><div class="apilada">${niveles.map(([n, c, claro]) => {
      const p = registros(d.r.filter(x => x[4] === n)) / t;
      return p > 0 ? `<div class="bar-hit${claro ? " claro" : ""}" tabindex="0" ${tip(`${d.nombre} · ${NIV[n]}: ${fpct(p)} (${fnum(registros(d.r.filter(x => x[4] === n)))} registros)`)}
        style="width:${p * 100}%;background:var(${c})">${p >= 0.06 ? fpct(p) : ""}</div>` : "";
    }).join("")}</div>`;
  }).join("");
  return `<div class="fila" style="grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)">
      ${card("Histórico de los KPIs por ejecución", tabla([["KPI"], ...fechas.map(f => [fechaCorta(f), 1])], hist))}
      ${card("Catálogo de KPIs", tabla([["KPI"], ["Unidad"], ["Definición"]], filasC))}
    </div>
    ${card("Distribución del nivel de estrés por dataset (% de registros)",
      leyenda(niveles.map(([n, c]) => ({ nombre: NIV[n], color: c })), "Nivel de estrés") + `<div class="hb">${barras}</div>`)}`;
}

// ---------------------------------------------------------------- Explorar: árbol de descomposición e influenciadores
const CAMPOS = [
  { id: "bloque", nombre: "Bloque", val: x => DS.get(x[0]).bloque, et: v => v },
  { id: "dataset", nombre: "Dataset", val: x => x[0], et: v => DS.get(v).nombre },
  { id: "genero", nombre: "Género", val: x => x[1], et: v => GEN[v] },
  { id: "edad", nombre: "Rango de edad", val: x => x[2], et: v => EDAD.get(v) },
  { id: "educ", nombre: "Nivel educativo", val: x => x[3], et: v => EDUC.get(v) },
];
const CAMPO = Object.fromEntries(CAMPOS.map(c => [c.id, c]));
// [{campo, sel}]: cada nivel desglosa el nodo elegido en el anterior.
// v6: el árbol empieza sin desglosar; «Ver ruta de ejemplo» carga la ruta del .pbix, del PDF y del Word (insights 2, 3 y 4)
const RUTA_EJEMPLO = () => [{ campo: "bloque", sel: "Validación psicológica" }, { campo: "genero", sel: 2 },
  { campo: "edad", sel: 2 }, { campo: "educ", sel: null }];
let arbolNiveles = [];
let kiObjetivo = ALTO;

function nodosNivel(r, campo) {
  return [...agrupar(r, CAMPO[campo].val)].map(([v, rr]) => ({ v, etiqueta: CAMPO[campo].et(v), p: pctNivel(rr, ALTO), n: registros(rr) }))
    .filter(x => x.n > 0).sort((a, b) => b.p - a.p);
}
function filasHasta(k) {  // filas del nodo elegido en el nivel k-1
  let r = filas();
  for (let i = 0; i < k; i++) { const nv = arbolNiveles[i]; if (nv.sel == null) return []; r = r.filter(x => CAMPO[nv.campo].val(x) === nv.sel); }
  return r;
}
function menuMas(k) {
  const usados = new Set(arbolNiveles.slice(0, k).map(n => n.campo));
  const libres = CAMPOS.filter(c => !usados.has(c.id));
  if (!libres.length) return "";
  return `<div class="mas-env"><button class="mas" type="button" data-mas="${k}" aria-label="Desglosar">+</button>
    <select data-elige="${k}" aria-label="Campo para desglosar" hidden><option value="">Desglosar por…</option>
      <option value="@alto">💡 Valor alto</option><option value="@bajo">💡 Valor bajo</option>
      ${libres.map(c => `<option value="${c.id}">${esc(c.nombre)}</option>`).join("")}</select></div>`;
}
function arbolHTML() {
  const raiz = filas();
  let h = `<div class="arbol"><div class="nivel"><div class="nivel-cab"><span>% estrés Alto</span></div><div class="nivel-sel"></div>
    <div class="nodos"><div class="nodo sel" style="cursor:default"><div class="pista-n"><i style="width:${(pctNivel(raiz, ALTO) || 0) * 100}%"></i></div>
    Total <span class="v">${fpct(pctNivel(raiz, ALTO))}</span></div></div>${arbolNiveles.length ? "" : menuMas(0)}</div>`;
  arbolNiveles.forEach((nv, k) => {
    const nodos = nodosNivel(filasHasta(k), nv.campo);
    const sel = nodos.find(x => x.v === nv.sel);
    h += `<div class="nivel"><div class="nivel-cab"><span>${esc(CAMPO[nv.campo].nombre)}${nv.ia ? " 💡" : ""}</span>
      <button type="button" data-quita="${k}" aria-label="Quitar este nivel">×</button></div>
      <div class="nivel-sel">${sel ? esc(sel.etiqueta) : "Elige un valor"}</div>
      <div class="nodos">${nodos.map(x => `<button type="button" class="nodo${x.v === nv.sel ? " sel" : ""}" data-nivel="${k}" data-v="${esc(String(x.v))}"
        ${tip(`${x.etiqueta}: ${fpct(x.p)} de estrés Alto (${fnum(x.n)} registros)`)}>
        <div class="pista-n"><i style="width:${(x.p || 0) * 100}%"></i></div>${esc(x.etiqueta)} <span class="v">${fpct(x.p)}</span></button>`).join("")}</div>
      ${k === arbolNiveles.length - 1 && sel ? menuMas(k + 1) : ""}</div>`;
  });
  return h + "</div>";
}
function influenciadores() {
  const r = filas().filter(x => x[4] !== 0);
  const campos = ["genero", "edad", "educ", "bloque"];
  const res = [];
  campos.forEach(c => {
    for (const [v, rr] of agrupar(r, CAMPO[c].val)) {
      const n1 = registros(rr), resto = r.filter(x => CAMPO[c].val(x) !== v), n0 = registros(resto);
      if (n1 < 30 || !n0) continue;
      const p1 = sum(rr.filter(x => x[4] === kiObjetivo), x => x[5]) / n1, p0 = sum(resto.filter(x => x[4] === kiObjetivo), x => x[5]) / n0;
      if (p0 > 0 && p1 / p0 > 1.05) res.push({ campo: CAMPO[c].nombre, valor: CAMPO[c].et(v), ratio: p1 / p0, p1, n1 });
    }
  });
  res.sort((a, b) => b.ratio - a.ratio);
  const niv = NIV[kiObjetivo];
  return `<div class="ki-cab">Qué influye en Nivel de estrés para ser
      <select id="ki-objetivo" aria-label="Nivel objetivo">${[BAJO, MOD, ALTO].map(n => `<option value="${n}"${n === kiObjetivo ? " selected" : ""}>${esc(NIV[n])}</option>`).join("")}</select></div>
    ${res.length ? `<div class="ki"><div class="q" style="font-size:11.5px">Cuando…</div><div class="q" style="font-size:11.5px;text-align:center">…se multiplica por</div>
      ${res.slice(0, 8).map(x => `<div class="q" ${tip(`${x.campo} = ${x.valor}: ${fpct(x.p1)} en ${niv} (${fnum(x.n1)} registros)`)}><b>${esc(x.campo)}</b> es <b>${esc(x.valor)}</b></div>
        <div class="burbuja">${fnum(x.ratio, 2)}x</div>`).join("")}</div>` : '<p class="vacio">Sin factores destacados con esta selección.</p>'}
    <p class="nota" style="margin-top:10px">Probabilidad de «${esc(niv)}» con ese valor frente al resto de registros (mínimo 30). Power BI usa su propio modelo estadístico: el orden coincide, los valores pueden variar ligeramente.</p>`;
}
function explorar() {
  return `<div class="fila" style="${DISENO_EXPLORAR}">
      <section class="card"><div class="cab-card"><h2>Árbol de descomposición: % de estrés Alto</h2>

function activarExplorar() {
  const vista = document.getElementById("vista");
  if (vista.dataset.explorar) return;  // #vista no se rehace: los oyentes se registran una sola vez
  vista.dataset.explorar = "1";
  const repintarArbol = () => { document.getElementById("arbol").innerHTML = arbolHTML(); };
  vista.addEventListener("click", ev => {
    if (ev.target.id === "ruta-ejemplo") { arbolNiveles = RUTA_EJEMPLO(); repintarArbol(); return; }
    if (ev.target.id === "reiniciar-arbol") { arbolNiveles = []; repintarArbol(); return; }
    const mas = ev.target.closest("[data-mas]");
    if (mas) { const s = vista.querySelector(`[data-elige="${mas.dataset.mas}"]`); s.hidden = false; s.focus(); return; }
    const q = ev.target.closest("[data-quita]");
    if (q) { arbolNiveles = arbolNiveles.slice(0, +q.dataset.quita); repintarArbol(); return; }
    const nodo = ev.target.closest(".nodo[data-nivel]");
    if (nodo) {
      const k = +nodo.dataset.nivel, nv = arbolNiveles[k];
      const valores = nodosNivel(filasHasta(k), nv.campo);
      nv.sel = valores.find(x => String(x.v) === nodo.dataset.v).v;
      arbolNiveles = arbolNiveles.slice(0, k + 1); repintarArbol();
    }
  });
  vista.addEventListener("change", ev => {
    if (ev.target.id === "ki-objetivo") { kiObjetivo = +ev.target.value; document.getElementById("ki").innerHTML = influenciadores(); return; }
    const s = ev.target.closest("[data-elige]");
    if (!s || !s.value) return;
    const k = +s.dataset.elige, r = filasHasta(k);
    let campo = s.value, ia = false, sel = null;
    if (campo.startsWith("@")) {  // «Valor alto/bajo»: el campo con el corte más extremo, como la división con IA del Power BI
      ia = true;
      const usados = new Set(arbolNiveles.slice(0, k).map(n => n.campo));
      let mejor = null;
      CAMPOS.filter(c => !usados.has(c.id)).forEach(c => {
        const nodos = nodosNivel(r, c.id).filter(x => x.n >= 30);
        if (!nodos.length) return;
        const cand = s.value === "@alto" ? nodos[0] : nodos[nodos.length - 1];
        if (!mejor || (s.value === "@alto" ? cand.p > mejor.p : cand.p < mejor.p)) mejor = { campo: c.id, v: cand.v, p: cand.p };
      });
      if (!mejor) return;
      campo = mejor.campo; sel = mejor.v;
    }
    arbolNiveles = arbolNiveles.slice(0, k).concat([{ campo, sel, ia }]);
    repintarArbol();
  });
}

function borde(r, hacia) {  // punto del borde del rectángulo r en la dirección de «hacia»
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2, dx = hacia[0] - cx, dy = hacia[1] - cy;
  const t = Math.min(dx ? (r.w / 2) / Math.abs(dx) : Infinity, dy ? (r.h / 2) / Math.abs(dy) : Infinity);
  return [cx + dx * t, cy + dy * t];
}

      <p>Modelo v2: <b>20 tablas</b> (8 dimensiones y 12 tablas de hechos), según modelo_datos_mysql.sql. El diagrama entregado indicaba 19.</p>
      <p>vw_hechos_estres: <b>${n("vw_hechos_estres")} filas</b> (12 datasets, sintéticos incluidos). El diagrama entregado indicaba 320.318.</p>
      <p>dwh_hechos_estres_unificado: <b>${n("dwh_hechos_estres_unificado")} filas</b>, solo los 9 datasets con señal real.</p></div>`)}`;
}
function activarDiagrama() {
  const vista = document.getElementById("vista");
  vista.querySelectorAll("[data-capa]").forEach(b => b.addEventListener("click", () => {
    capaActual = b.dataset.capa;
    vista.querySelectorAll("[data-capa]").forEach(x => x.setAttribute("aria-pressed", x === b));
    document.getElementById("lienzo").innerHTML = svgCapa(capaActual);
    document.getElementById("texto-capa").textContent = CAPAS[capaActual].texto;
  }));
  const elegir = g => {
    tablaSel = g.dataset.tabla;
    vista.querySelectorAll(".tbl").forEach(x => x.classList.toggle("sel", x === g));
    document.getElementById("ficha").innerHTML = ficha(tablaSel);
  };
  const lienzo = document.getElementById("lienzo");
  lienzo.addEventListener("click", ev => { const g = ev.target.closest(".tbl"); if (g) elegir(g); });
  lienzo.addEventListener("keydown", ev => { const g = ev.target.closest(".tbl"); if (g && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); elegir(g); } });
}

// ---------------------------------------------------------------- navegación (hash #pagina)
const menu = document.getElementById("menu");
menu.innerHTML = PAGINAS.filter(p => p.menu).map(p => `<a href="#${p.id}">${esc(p.menu)}</a>`).join("");
function pagina() { return PAGINAS.find(p => "#" + p.id === location.hash) || PAGINAS[0]; }
function pintar() {
  const p = pagina();
  document.getElementById("titulo").textContent = p.titulo;
  document.getElementById("subtitulo").textContent = p.sub;
  document.getElementById("filtros").hidden = !p.filtros;
  document.body.classList.toggle("con-fondo", !!p.fondo);
  // Logos de INESDI y UNIE en blanco, solo en Inicio (como la banda del Power BI)
  const logos = document.getElementById("logos");
  if (IMG.logo_inesdi_blanco) document.getElementById("logo").src = IMG.logo_inesdi_blanco;
  if (IMG.logo_unie_blanco) document.getElementById("logo2").src = IMG.logo_unie_blanco;
  logos.hidden = !p.logo || !IMG.logo_inesdi_blanco;
  document.getElementById("logo2").hidden = !IMG.logo_unie_blanco;
  logos.querySelector(".sep-logo").hidden = !IMG.logo_unie_blanco;
  menu.querySelectorAll("a").forEach(a => a.getAttribute("href") === "#" + p.id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  document.getElementById("vista").innerHTML = p.f();
  if (p.alPintar) p.alPintar();
}
window.addEventListener("hashchange", () => { pintar(); window.scrollTo(0, 0); });
document.getElementById("pie").textContent =
  `Datos: ${D.fuente || "MySQL local"}${D.exportado ? " · datos del " + D.exportado : ""}. Mismas tablas y medidas que el informe de Power BI (TFM_Estres.pbip).`;
pintar();

// ---------------------------------------------------------------- tooltip
const tipEl = document.getElementById("tip");
function mostrar(el, x, y) {
  if (el.dataset.tipds) tipEl.innerHTML = tooltipResumen(filas().filter(r => r[0] === +el.dataset.tipds), DS.get(+el.dataset.tipds).nombre);
  else if (el.dataset.tipbl) tipEl.innerHTML = tooltipResumen(filas().filter(r => DS.get(r[0]).bloque === el.dataset.tipbl), el.dataset.tipbl);
  else tipEl.textContent = el.dataset.tip;
  tipEl.hidden = false;
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.min(x + 12, innerWidth - w - 8) + "px";
  tipEl.style.top = (y - h - 10 < 8 ? y + 16 : y - h - 10) + "px";
}
document.addEventListener("mousemove", ev => { const el = ev.target.closest("[data-tip], [data-tipds], [data-tipbl]"); el ? mostrar(el, ev.clientX, ev.clientY) : (tipEl.hidden = true); });
document.addEventListener("focusin", ev => { const el = ev.target.closest("[data-tip], [data-tipds], [data-tipbl]"); if (el) { const r = el.getBoundingClientRect(); mostrar(el, r.left + r.width / 2, r.top); } });
document.addEventListener("focusout", () => { tipEl.hidden = true; });
</script>
