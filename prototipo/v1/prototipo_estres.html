* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45 }
table { font-size: inherit; color: inherit }
h1, h2, h3 { font-family: var(--font-strong); font-weight: 600; margin: 0; text-wrap: balance }
p { margin: 0 }
.tab { font-variant-numeric: tabular-nums }

/* Banda superior */
.banda { background: var(--band); color: var(--band-ink) }
.banda-in { max-width: 1280px; margin: 0 auto; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 12px 24px; align-items: center; flex-wrap: wrap }
.banda h1 { font-size: 21px; line-height: 1.2 }
.banda .sub { font-size: 12.5px; opacity: .9 }
.banda .titulo { flex: 1 1 320px; min-width: 0 }
nav { display: flex; flex-wrap: wrap; gap: 6px }
nav a { display: inline-block; padding: 9px 14px; min-width: 92px; text-align: center; border-radius: 4px; background: var(--nav);
  color: var(--nav-ink); text-decoration: none; font-size: 13px; border: 1px solid transparent }
nav a:hover { border-color: var(--band-ink) }
nav a[aria-current="page"] { background: var(--nav-on); color: var(--nav-on-ink); font-family: var(--font-strong); font-weight: 600 }
a:focus-visible, select:focus-visible, .bar-hit:focus-visible { outline: 2px solid var(--alto); outline-offset: 2px }

main { max-width: 1280px; margin: 0 auto; padding-block: 16px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px }
.fila { display: grid; gap: 14px; grid-template-columns: repeat(var(--c, 2), minmax(0, 1fr)) }
@media (max-width: 900px) { .fila { grid-template-columns: minmax(0, 1fr) !important } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 4px 14px var(--shadow);
  padding: 14px 16px; min-width: 0 }
.card h2 { font-size: 16px; margin-bottom: 10px }
.card h3 { font-size: 14.5px; margin-bottom: 4px }
.nota { font-size: 12.5px; color: var(--ink-2) }
.nota p + p, .texto p + p { margin-top: 4px }
.texto { color: var(--ink-2); font-size: 13.5px; max-width: 75ch }

/* Filtros */
.filtros { display: grid; gap: 14px; grid-template-columns: repeat(4, minmax(0, 1fr)) }
@media (max-width: 900px) { .filtros { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.filtros label { display: block; font-family: var(--font-strong); font-weight: 600; color: var(--head); font-size: 14px; margin-bottom: 6px }
:root[data-theme="dark"] .filtros label { color: var(--ink) }

.kpis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)) }
.kpi { border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; min-width: 0 }
.kpi .et { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.kpi .v { font-family: var(--font-strong); font-weight: 600; font-size: 30px; line-height: 1.15; font-variant-numeric: tabular-nums }
.kpi .v.alerta { color: var(--alerta) }

/* Gráficos de barras (HTML, a escala) */
.leyenda { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px }
.leyenda b { color: var(--ink); font-family: var(--font-strong); font-weight: 600 }
.leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px }
.hb { display: grid; grid-template-columns: minmax(90px, max-content) minmax(0, 1fr); gap: 6px 10px; align-items: center; font-size: 12.5px }
.hb .lab { color: var(--ink-2); text-align: right; overflow-wrap: anywhere }
.pista, .eje { margin-right: 46px }  /* hueco para la etiqueta de valor de la barra más larga */
.pista { position: relative; min-height: 22px }
.pista .g { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--grid) }
.barra { position: relative; height: 18px; border-radius: 0 4px 4px 0; display: flex; align-items: center }
.barra + .barra { margin-top: 2px }
.barra span { position: absolute; left: calc(100% + 6px); white-space: nowrap; color: var(--ink-2); font-size: 11.5px; font-variant-numeric: tabular-nums }
.eje { position: relative; height: 16px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums }
.eje span { position: absolute; transform: translateX(-50%) }
.titulo-eje { text-align: center; font-size: 12px; color: var(--ink-2); font-family: var(--font-strong); font-weight: 600; margin-top: 2px }

.cols { display: flex; align-items: flex-end; gap: 10px; height: 180px; padding-top: 18px; border-bottom: 1px solid var(--line); position: relative }
.cols .grp { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 2px; height: 100%; min-width: 0 }
.col { position: relative; width: min(56px, 42%); border-radius: 4px 4px 0 0 }
.col span { position: absolute; bottom: calc(100% + 3px); left: 50%; transform: translateX(-50%); font-size: 11.5px; color: var(--ink-2);
  white-space: nowrap; font-variant-numeric: tabular-nums }
.cols-lab { display: flex; gap: 10px; font-size: 12px; color: var(--ink-2); margin-top: 4px }
.cols-lab div { flex: 1; text-align: center; min-width: 0; overflow-wrap: anywhere }

.apilada { display: flex; height: 22px; gap: 2px }
.apilada div { display: flex; align-items: center; justify-content: center; font-size: 11.5px; color: #FFFFFF; overflow: hidden;

.apilada div.claro { color: #264653 }
.apilada div:last-child { border-radius: 0 4px 4px 0 }

/* Tablas */
.tabla-env { overflow-x: auto }
table.t { border-collapse: collapse; width: 100%; font-size: 12.5px }

<script>
"use strict";
// ---------------------------------------------------------------- datos
// Única puerta de entrada a los datos: hoy, el JSON incrustado (exportado de MySQL local).

function cargarDatos() { return JSON.parse(document.getElementById("datos").textContent); }

// ---------------------------------------------------------------- formato es-ES (como el Power BI)
function fnum(v, dec = 0) {
  if (v == null || !isFinite(v)) return "—";
  // toPrecision(12) evita el error binario de toFixed (17,005 → 17,01, como Power BI)
  const f = Math.pow(10, dec), r = Math.round(+Math.abs(v).toPrecision(12) * f) / f;
  const [e, d] = r.toFixed(dec).split(".");
  return (v < 0 ? "−" : "") + e.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (d ? "," + d : "");
}
const fpct = (v, dec = 1) => v == null || !isFinite(v) ? "—" : fnum(v * 100, dec) + "%";

const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
const wmean = (a, v, w) => { const n = sum(a, w); return n ? sum(a, x => v(x) * w(x)) / n : null; };
const porNombre = (a, b) => a.localeCompare(b, "es");

const F = { bloque: "", g: "", e: "", ed: "" };
function opciones(sel, items) {
  sel.innerHTML = '<option value="">Todas</option>' + items.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join("");
}

opciones(document.getElementById("f-bloque"), bloques.map(b => [b, b]));
opciones(document.getElementById("f-genero"), Object.entries(GEN).sort((a, b) => porNombre(a[1], b[1])));
opciones(document.getElementById("f-edad"), D.edades.map(e => [e.id, e.nombre]));
opciones(document.getElementById("f-educ"), D.educacion.map(e => [e.id, e.nombre]));
[["f-bloque", "bloque"], ["f-genero", "g"], ["f-edad", "e"], ["f-educ", "ed"]].forEach(([id, k]) =>
  document.getElementById(id).addEventListener("change", ev => { F[k] = ev.target.value; pintar(); }));

// Cubo: [dataset, genero, edad, educación, nivel, n]
function filas(conFiltros = true) {
  return D.cubo.filter(([d, g, e, ed]) => !conFiltros || (
    (!F.bloque || DS.get(d).bloque === F.bloque) && (!F.g || g === +F.g) && (!F.e || e === +F.e) && (!F.ed || ed === +F.ed)));
}
const registros = r => sum(r, x => x[5]);

function agrupar(r, clave) {
  const m = new Map();
  r.forEach(x => { const k = clave(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); });
  return m;
}

// ---------------------------------------------------------------- piezas
function ticks(max) {
  if (!(max > 0)) return [0, 1];
  const bruto = max / 4, p = Math.pow(10, Math.floor(Math.log10(bruto)));
  const paso = [1, 2, 2.5, 5, 10].map(k => k * p).find(s => s >= bruto);
  const t = []; for (let v = 0; v < max + paso * 0.999; v += paso) t.push(+v.toFixed(10));
  return t;
}
const tip = (t) => `data-tip="${esc(t)}"`;

// Barras horizontales; series: [{nombre, color, valor: item => número, texto}]
function barrasH(items, series, { fmt = fpct, tituloEje = "" } = {}) {
  if (!items.length) return '<p class="vacio">Sin registros con esta selección.</p>';
  const max = Math.max(...items.flatMap(it => series.map(s => s.valor(it) || 0)));
  const t = ticks(max), top = t[t.length - 1];
  const grid = t.map(v => `<i class="g" style="left:${v / top * 100}%"></i>`).join("");
  let h = series.length > 1 ? leyenda(series) : "";
  h += '<div class="hb">';
  items.forEach(it => {
    h += `<div class="lab">${esc(it.etiqueta)}</div><div class="pista">${grid}` + series.map(s => {
      const v = s.valor(it);
      return `<div class="barra bar-hit" tabindex="0" ${tip(`${it.etiqueta} · ${s.nombre}: ${fmt(v)}`)}
        style="width:${(v || 0) / top * 100}%;background:var(${s.color})"><span>${fmt(v)}</span></div>`;
    }).join("") + "</div>";
  });
  // Etiquetas del eje con los decimales justos para el paso (20% · 2,5% · 0,5)
  const esPct = fmt === fpct, paso = (t[1] - t[0]) * (esPct ? 100 : 1);
  const dec = Number.isInteger(+paso.toFixed(6)) ? 0 : Number.isInteger(+(paso * 10).toFixed(6)) ? 1 : 2;
  const fe = v => esPct ? fpct(v, dec) : fnum(v, dec);
  h += `<div></div><div class="eje">${t.map(v => `<span style="left:${v / top * 100}%">${fe(v)}</span>`).join("")}</div></div>`;
  if (tituloEje) h += `<div class="titulo-eje">${esc(tituloEje)}</div>`;
  return h;
}
function leyenda(series, titulo = "") {
  return `<div class="leyenda">${titulo ? `<b>${esc(titulo)}</b>` : ""}${series.map(s =>
    `<span><i style="background:var(${s.color})"></i>${esc(s.nombre)}</span>`).join("")}</div>`;

// Columnas agrupadas; categorias: [{etiqueta, ...}], series como en barrasH
function columnas(cats, series, { tituloLeyenda = "", tituloEje = "" } = {}) {
  const max = Math.max(...cats.flatMap(c => series.map(s => s.valor(c) || 0)));
  const top = ticks(max).slice(-1)[0];
  let h = series.length > 1 ? leyenda(series, tituloLeyenda) : "";
  h += '<div class="cols">' + cats.map(c => '<div class="grp">' + series.map(s => {
    const v = s.valor(c);
    return `<div class="col bar-hit" tabindex="0" ${tip(`${c.etiqueta}${series.length > 1 ? " · " + s.nombre : ""}: ${fpct(v)}`)}
      style="height:${(v || 0) / top * 100}%;background:var(${s.color})"><span>${fpct(v)}</span></div>`;
  }).join("") + "</div>").join("") + "</div>";
  h += '<div class="cols-lab">' + cats.map(c => `<div>${esc(c.etiqueta)}</div>`).join("") + "</div>";
  if (tituloEje) h += `<div class="titulo-eje">${esc(tituloEje)}</div>`;
  return h;
}
const tarjeta = (et, v, clase = "") => `<div class="kpi"><div class="et" title="${esc(et)}">${esc(et)}</div><div class="v ${clase}">${v}</div></div>`;
const card = (titulo, cuerpo, estilo = "") => `<section class="card" ${estilo}>${titulo ? `<h2>${esc(titulo)}</h2>` : ""}${cuerpo}</section>`;
function tabla(cabeza, cuerpo, pie = "") {
  return `<div class="tabla-env"><table class="t"><thead><tr>${cabeza.map(([t, n]) => `<th${n ? ' class="n"' : ""}>${esc(t)}</th>`).join("")}</tr></thead>
    <tbody>${cuerpo}</tbody>${pie}</table></div>`;
}

const ultima = fechas[fechas.length - 1];
const kpi = cod => (D.kpi_resultados.find(k => k.codigo === cod && k.fecha === ultima) || {}).valor;
const KPIS = [["KPI_ESTRES_ALTO", "Estrés Alto (%)"], ["KPI_BRECHA_GENERO", "Brecha M − H (pts)"], ["KPI_RIESGO_CRITICO", "Riesgo crítico (%)"],
  ["KPI_TASA_TRATAMIENTO", "Tratamiento (%)"], ["KPI_DISCRIMINANTE_LIWC", "Ratio LIWC"], ["KPI_COBERTURA_DEMO", "Cobertura (%)"]];

  { id: "panorama", menu: "1 Panorama", titulo: "Panorama general del estrés estudiantil", sub: "9 fuentes con señal real · sin los 3 datasets sintéticos", f: panorama, filtros: true },
  { id: "demografia", menu: "2 Demografía", titulo: "Demografía", sub: "Estrés Alto por género, edad y nivel educativo", f: demografia, filtros: true },

];

  const total = registros(filas(false));
  const bloquesTxt = [
    ["1 · Factores internos", "Academic Stress, Student Anxiety (GAD-7), Student Mental Health Survey. Student Habits es sintético.", [["panorama", "Panorama"], ["demografia", "Demografía"]]],
    ["2 · Hábitos digitales", "Social Media and Mental Health. Social Media vs Sleep y Mental Health Lifestyle son sintéticos.", [["panorama", "Panorama"], ["demografia", "Demografía"]]],
    ["3 · Percepción emocional", "Dreaddit (train y test), texto de Reddit con NLP; Depression Student.", [["lenguaje", "Lenguaje"]]],
    ["4 · Validación psicológica", "DASS-42 y Mental Health Dataset (búsqueda de tratamiento).", [["validacion", "Validación"]]],
  ];
  return `<div class="fila" style="--c:2">
    ${card("Qué analiza este informe", `<div class="texto">
      <p>12 datasets públicos organizados en 4 bloques analíticos. Cada fuente se estudia por separado y se compara con las demás mediante un nivel de estrés común (Bajo / Moderado / Alto) y dimensiones conformes de género, edad y nivel educativo.</p>
      <p>${fnum(total)} registros en las 9 fuentes con señal real; los 3 datasets sintéticos quedan fuera de las medidas.</p>
      <p>Navega con el menú superior. Las tarjetas son los 6 KPIs guardados en el DWH (última ejecución).</p></div>`)}
    ${card("", `<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${KPIS.map(([c, n]) => tarjeta(n, fnum(kpi(c), 2))).join("")}</div>`)}
  </div>
  <div class="fila" style="--c:4">${bloquesTxt.map(([t, f, p]) => card("", `<div class="bloque"><h3>${esc(t)}</h3>
    <p class="texto">${esc(f)}</p><p class="texto" style="margin-top:6px">Página principal: ${p.map(([id, n]) => `<a href="#${id}">${n}</a>`).join(" y ")}</p></div>`)).join("")}</div>
  ${card("Cómo leer el informe", `<div class="texto" style="max-width:none">
    <p>Cada fuente define «Alto» con su propio criterio nativo, mapeado a un constructo común (GAD-7 y DASS con baremos clínicos): compara tendencias, no niveles absolutos entre fuentes.</p>
    <p>Los filtros de Panorama y Demografía filtran por bloque, género, edad y nivel educativo. Solo el 17 % de los registros informa a la vez género y edad. Modelos y KPIs cubren los cuatro bloques.</p>

function panorama() {
  const r = filas(), t = registros(r);
  const cobertura = t ? registros(r.filter(x => x[1] !== 0 && x[2] !== 0)) / t : null;
  const fuentes = new Set(r.map(x => x[0])).size;
  const porBloque = [...agrupar(r, x => DS.get(x[0]).bloque)].map(([k, v]) => ({ etiqueta: k, v: pctNivel(v, ALTO) }));
  const porDs = [...agrupar(r, x => x[0])].map(([k, v]) => ({ etiqueta: DS.get(k).nombre, v: pctNivel(v, ALTO) }));
  const serie = [{ nombre: "% estrés Alto", color: "--serie1", valor: it => it.v }];
  porBloque.sort((a, b) => b.v - a.v); porDs.sort((a, b) => b.v - a.v);
  return `${card("", `<div class="kpis">${tarjeta("Registros", fnum(t))}${tarjeta("% estrés Alto", fpct(pctNivel(r, ALTO)))}
      ${tarjeta("% estrés Alto global", fpct(pctNivel(filas(false), ALTO)))}${tarjeta("Cobertura demográfica", fpct(cobertura))}${tarjeta("Fuentes", fnum(fuentes))}</div>`)}
    <div class="fila" style="--c:2">
      ${card("% de estrés Alto por bloque analítico", barrasH(porBloque, serie, { tituloEje: "% estrés Alto" }))}
      ${card("% de estrés Alto por dataset", barrasH(porDs, serie, { tituloEje: "% estrés Alto" }))}
    </div>
    <p class="nota">Cada fuente define «Alto» con su propio criterio (escala nativa mapeada a Bajo / Moderado / Alto en dim_mapeo_estres; GAD-7 y DASS con baremos clínicos). Compara tendencias, no niveles absolutos entre fuentes.</p>`;
}

function demografia() {
  const r = filas();
  const serie = [{ nombre: "% estrés Alto", color: "--serie1", valor: c => c.v }];
  const dim = (idx, nombres, orden) => [...agrupar(r.filter(x => x[idx] !== 0), x => x[idx])]
    .map(([k, v]) => ({ k, etiqueta: nombres(k), v: pctNivel(v, ALTO) })).sort(orden);
  const gen = dim(1, k => GEN[k], (a, b) => porNombre(a.etiqueta, b.etiqueta));
  const eda = dim(2, k => EDAD.get(k), (a, b) => a.k - b.k);
  const edu = dim(3, k => EDUC.get(k), (a, b) => a.k - b.k);
  const vacio = '<p class="vacio">Sin registros con esta selección.</p>';
  const graf = (c) => c.length ? columnas(c, serie) : vacio;

  // Matriz Género × rango de edad (sin «No reportado»), con totales como en el Power BI
  const rm = r.filter(x => x[1] !== 0 && x[2] !== 0);
  const gs = [...new Set(rm.map(x => x[1]))].sort((a, b) => porNombre(GEN[a], GEN[b]));
  const es = [...new Set(rm.map(x => x[2]))].sort((a, b) => a - b);
  const celda = sub => `<td class="n">${fpct(pctNivel(sub, ALTO))}</td><td class="n">${fnum(registros(sub))}</td>`;
  let cuerpo = gs.map(g => `<tr><td>${esc(GEN[g])}</td>${es.map(e => celda(rm.filter(x => x[1] === g && x[2] === e))).join("")}${celda(rm.filter(x => x[1] === g))}</tr>`).join("");
  cuerpo += `<tr class="total"><td>Total</td>${es.map(e => celda(rm.filter(x => x[2] === e))).join("")}${celda(rm)}</tr>`;
  const matriz = rm.length ? `<div class="tabla-env"><table class="t"><thead>
      <tr><th>Rango de edad</th>${es.map(e => `<th colspan="2">${esc(EDAD.get(e))}</th>`).join("")}<th colspan="2">Total</th></tr>
      <tr><th>Género</th>${[...es, 0].map(() => '<th class="n">% Alto</th><th class="n">Registros</th>').join("")}</tr></thead>
      <tbody>${cuerpo}</tbody></table></div>` : vacio;

  return `<div class="fila" style="--c:3">
      ${card("% de estrés Alto por género", graf(gen))}${card("% de estrés Alto por rango de edad", graf(eda))}${card("% de estrés Alto por nivel educativo", graf(edu))}
    </div>
    <div class="fila" style="grid-template-columns:minmax(0,3fr) minmax(0,1fr)">
      ${card("Género × rango de edad", matriz)}
      ${card("Cómo leer esta página", `<div class="nota"><p>Solo el 17 % de los registros informa género y edad a la vez: los filtros demográficos reducen mucho la muestra.</p>
        <p>El 91 % de «Masculino» procede del Mental Health Dataset.</p><p>«Otro»: solo 677 registros, leer con cautela.</p><p>«No reportado» no se muestra.</p></div>`)}
    </div>`;
}

function lenguaje() {
  const liwc = (r, n) => wmean(r.filter(x => x.nivel === n), x => x.liwc, x => x.posts);
  const ratio = r => { const b = liwc(r, BAJO); return b ? liwc(r, ALTO) / b : null; };
  const subs = [...agrupar(D.nlp, x => x.sub)].map(([k, v]) => ({
    etiqueta: D.subreddits[k], alto: liwc(v, ALTO), bajo: liwc(v, BAJO), ratio: ratio(v),
    posts: sum(v, x => x.posts), sent: wmean(v, x => x.sent, x => x.posts) }));
  const graf = [...subs].sort((a, b) => b.alto - a.alto);
  const f2 = (v, d = 2) => fnum(v, d);
  const series = [{ nombre: "Con estrés", color: "--serie1", valor: s => s.alto }, { nombre: "Sin estrés", color: "--serie2", valor: s => s.bajo }];
  const filasT = [...subs].sort((a, b) => porNombre(a.etiqueta, b.etiqueta)).map(s =>
    `<tr><td>${esc(s.etiqueta)}</td><td class="n">${fnum(s.ratio, 2)}</td><td class="n">${fnum(s.posts)}</td><td class="n">${fnum(s.sent, 3)}</td></tr>`).join("");
  return `${card("", `<div class="kpis">${tarjeta("Ratio LIWC ansiedad (Alto / Bajo)", fnum(ratio(D.nlp), 2))}
      ${tarjeta("Sentimiento medio", fnum(wmean(D.nlp, x => x.sent, x => x.posts), 3))}${tarjeta("Posts analizados", fnum(sum(D.nlp, x => x.posts)))}</div>`)}
    <div class="fila" style="grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)">
      ${card("Vocabulario de ansiedad (LIWC) por subreddit", barrasH(graf, series, { fmt: f2, tituloEje: "Densidad media de palabras de ansiedad (LIWC)" }))}
      ${card("Detalle por subreddit", tabla([["Subreddit"], ["Ratio", 1], ["Posts", 1], ["Sentimiento", 1]], filasT))}
    </div>
    <p class="nota">Dreaddit no incluye género ni edad: esta página no usa filtros demográficos. Un ratio &gt; 1 indica más vocabulario de ansiedad en los posts con estrés.</p>`;
}

function validacion() {
  const ans = g => wmean(D.dass.filter(x => x.g === g), x => x.ans, x => x.n);
  const sev = r => { const v = wmean(r, x => x.sev, x => x.n); return v == null ? null : v / 100; };
  const trat = r => { const n = sum(r, x => x.n); return n ? sum(r, x => x.trat) / n : null; };
  const nivs = [BAJO, MOD, ALTO].map(n => ({ etiqueta: NIV[n], r: D.tratamiento.filter(x => x.nivel === n) }));
  // Valores de antecedentes tal como vienen en los datos («No / Sí» en Supabase, «No / Yes» en MySQL), «No» primero
  const ants = [...new Set(D.tratamiento.map(x => x.ant))].sort((a, b) => (a === "No" ? -1 : b === "No" ? 1 : porNombre(a, b)));
  const sT = ants.map((a, i) => ({ nombre: a, color: i ? "--serie2" : "--serie1", valor: c => trat(c.r.filter(x => x.ant === a)) }));
  const eds = [1, 2, 3].map(e => ({ etiqueta: EDUC.get(e), r: D.dass.filter(x => x.ed === e) }));
  const sD = [[2, "--serie1"], [1, "--serie2"]].map(([g, c]) => ({ nombre: GEN[g], color: c, valor: x => sev(x.r.filter(y => y.g === g)) }));
  return `<div class="fila" style="grid-template-columns:minmax(0,3fr) minmax(0,1fr)">
      ${card("", `<div class="kpis">${tarjeta("Brecha ansiedad M − H (pts)", fnum(ans(2) - ans(1), 2))}${tarjeta("% estrés severo DASS", fpct(sev(D.dass)))}
        ${tarjeta("% búsqueda de tratamiento", fpct(trat(D.tratamiento)))}</div>`)}
      ${card("", `<div class="kpis">${tarjeta("Riesgo crítico, KPI 3 (%)", fnum(kpi("KPI_RIESGO_CRITICO"), 2))}</div>`)}
    </div>
    <div class="fila" style="--c:2">
      ${card("Búsqueda de tratamiento por nivel de estrés y antecedentes familiares", columnas(nivs, sT, { tituloLeyenda: "Antecedentes familiares", tituloEje: "Nivel de estrés" }))}
      ${card("DASS-42: % de estrés severo por estudios y género", columnas(eds, sD, { tituloLeyenda: "Género", tituloEje: "Nivel educativo" }))}
    </div>
    ${card("Lectura", `<div class="texto" style="max-width:none"><p>La búsqueda de tratamiento depende de los antecedentes familiares (≈72 % con antecedentes frente a ≈35 % sin ellos), no del nivel de estrés percibido: brecha entre malestar y ayuda.</p>
      <p>Advertencia: el KPI 3 se calcula sobre Depression Student, cuyo modelo obtuvo AUC 0,998 (posible etiqueta generada por fórmula). Interpretar con cautela.</p></div>`)}`;
}

function modelos() {
  const m = D.modelos;
  const sinAlerta = m.filter(x => !x.alerta), conAlerta = m.filter(x => x.alerta);
  const auc = [...m].sort((a, b) => b.auc - a.auc).map(x => ({ etiqueta: x.dataset, v: x.auc }));
  const f3 = (v) => fnum(v, 3);
  const filasT = [...m].sort((a, b) => porNombre(a.dataset, b.dataset)).map(x => `<tr><td>${esc(x.dataset)}</td><td>${esc(x.modelo)}</td>
    <td>${esc(x.protocolo)}</td><td class="n">${fnum(x.n)}</td><td class="n">${f3(x.auc)}</td><td class="n">${f3(x.f1)}</td><td class="n">${f3(x.acc)}</td></tr>`).join("");
  return `<div class="fila" style="--c:2">
      ${card("", `<div class="kpis">${tarjeta("AUC medio (sin alertas)", f3(sum(sinAlerta, x => x.auc) / sinAlerta.length))}
        ${tarjeta("Datasets con alerta", fnum(conAlerta.length), "alerta")}</div>`)}
      ${card("Alertas", `<div class="texto"><p>Academic Stress: n = 140, el accuracy no supera al baseline (exploratorio).</p>
        <p>Depression Student: AUC ≈ 1, posible etiqueta generada por fórmula.</p></div>`)}
    </div>
    <div class="fila" style="grid-template-columns:minmax(0,1fr) minmax(0,2fr)">
      ${card("AUC del mejor modelo por dataset", barrasH(auc, [{ nombre: "AUC", color: "--serie1", valor: x => x.v }], { fmt: (v, d) => fnum(v, d ?? 3), tituloEje: "AUC" }))}
      ${card("Detalle del mejor modelo", tabla([["Dataset"], ["Modelo"], ["Protocolo"], ["n", 1], ["AUC", 1], ["F1", 1], ["Accuracy", 1]], filasT))}
    </div>`;
}

function kpis() {
  const cat = [...D.kpi_catalogo].sort((a, b) => porNombre(a.nombre, b.nombre));
  const hist = cat.map(k => `<tr><td>${esc(k.nombre)}</td>${fechas.map(f => {
    const r = D.kpi_resultados.find(x => x.codigo === k.codigo && x.fecha === f);
    return `<td class="n">${r ? fnum(r.valor, 2) : ""}</td>`; }).join("")}</tr>`).join("");
  const filasC = cat.map(k => `<tr><td>${esc(k.nombre)}</td><td>${esc(k.unidad)}</td><td>${esc(k.descripcion)}</td></tr>`).join("");
  const niveles = [[BAJO, "--bajo", false], [MOD, "--mod", true], [ALTO, "--alto", false]];
  const porDs = [...agrupar(filas(false).filter(x => x[4] !== 0), x => x[0])]
    .map(([k, v]) => ({ nombre: DS.get(k).nombre, r: v })).sort((a, b) => porNombre(a.nombre, b.nombre));
  const barras = porDs.map(d => {
    const t = registros(d.r);
    return `<div class="lab">${esc(d.nombre)}</div><div class="apilada">${niveles.map(([n, c, claro]) => {
      const p = registros(d.r.filter(x => x[4] === n)) / t;
      return p > 0 ? `<div class="bar-hit${claro ? " claro" : ""}" tabindex="0" ${tip(`${d.nombre} · ${NIV[n]}: ${fpct(p)} (${fnum(registros(d.r.filter(x => x[4] === n)))} registros)`)}
        style="width:${p * 100}%;background:var(${c})">${p >= 0.06 ? fpct(p) : ""}</div>` : "";
    }).join("")}</div>`;
  }).join("");
  return `<div class="fila" style="grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)">
      ${card("Histórico de los KPIs por ejecución", tabla([["KPI"], ...fechas.map(f => [fechaCorta(f), 1])], hist))}
      ${card("Catálogo de KPIs", tabla([["KPI"], ["Unidad"], ["Definición"]], filasC))}
    </div>
    ${card("Distribución del nivel de estrés por dataset (% de registros)",
      leyenda(niveles.map(([n, c]) => ({ nombre: NIV[n], color: c })), "Nivel de estrés") + `<div class="hb">${barras}</div>`)}`;
}

// ---------------------------------------------------------------- navegación (hash #pagina)
const menu = document.getElementById("menu");
menu.innerHTML = PAGINAS.map(p => `<a href="#${p.id}">${esc(p.menu)}</a>`).join("");
function pagina() { return PAGINAS.find(p => "#" + p.id === location.hash) || PAGINAS[0]; }
function pintar() {
  const p = pagina();
  document.getElementById("titulo").textContent = p.titulo;
  document.getElementById("subtitulo").textContent = p.sub;
  document.getElementById("filtros").hidden = !p.filtros;
  menu.querySelectorAll("a").forEach(a => a.getAttribute("href") === "#" + p.id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  document.getElementById("vista").innerHTML = p.f();
}
window.addEventListener("hashchange", () => { pintar(); window.scrollTo(0, 0); });
document.getElementById("pie").textContent =
  `Datos: ${D.fuente || "MySQL local"}${D.exportado ? " · datos del " + D.exportado : ""}. Mismas tablas y medidas que el informe de Power BI (TFM_Estres.pbip).`;
pintar();

// ---------------------------------------------------------------- tooltip
const tipEl = document.getElementById("tip");
function mostrar(el, x, y) {
  tipEl.textContent = el.dataset.tip; tipEl.hidden = false;
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.min(x + 12, innerWidth - w - 8) + "px";
  tipEl.style.top = (y - h - 10 < 8 ? y + 16 : y - h - 10) + "px";
}
document.addEventListener("mousemove", ev => { const el = ev.target.closest("[data-tip]"); el ? mostrar(el, ev.clientX, ev.clientY) : (tipEl.hidden = true); });
document.addEventListener("focusin", ev => { const el = ev.target.closest("[data-tip]"); if (el) { const r = el.getBoundingClientRect(); mostrar(el, r.left + r.width / 2, r.top); } });
document.addEventListener("focusout", () => { tipEl.hidden = true; });
</script>
